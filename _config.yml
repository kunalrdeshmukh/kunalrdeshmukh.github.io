  # Personalize this section! Swap in your real hobbies / interests.
  - title: A Little More About Me
    layout: text
    content: | # this will include new lines to allow paragraphs
        When I'm not wrangling pipelines, I like to tinker. I once turned a Raspberry Pi and an old hard drive into a home FTP server (and then, naturally, [blogged about it](https://medium.com/kunalrdeshmukh/ftp-server-with-raspberry-pi-and-hdd-3c10ce95f2d4)).

        I also enjoy writing the occasional Medium post to explain things I've just figured out, and I have a soft spot for a good recommendation-system rabbit hole.

