about_content: | # this will include new lines to allow paragraphs
  Hi! I'm Kunal, a Data Engineer. I build pipelines - from the lake to a container (or pod) and back - and help find the interesting stuff hiding in data.

  These days I spend a lot of time in the integrity measurement world: figuring out what's real, what's not, and building the metrics (and a couple of AI agents) to tell the difference.

  Before this I wore a Software Developer hat, and even a Data Scientist one during an internship.


content:
  - title: Experience # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: Meta Platforms
        link: meta.com
        link_text: meta.com
        sub_title: Data Engineer
        caption: March 2022 - Current · London, UK
        # quote: >
        #   Solving 21st century problems by
        description: | # this will include new lines to allow paragraphs
            I turn oceans of data into insights that leadership and product teams actually use. Along the way I helped move our main integrity measurement metric from human-only to mostly AI-assisted labeling, kept an eye on things during the Threads launch, and built a couple of AI agents that quietly save the team a lot of engineering hours each week.

      - layout: left
        title: Ericsson
        link: ericsson.com
        link_text: Ericsson.com
        sub_title: Data Engineer
        caption: July 2019 - March 2022 · Santa Clara, CA
        # quote: >
        #   Solving 21st century problems by
        description: | # this will include new lines to allow paragraphs
            I worked with Data Scientists and played a Machine Learning Engineer role to build end-to-end ML applications - the kind that let users easily deploy, use, retrain and monitor machine learning models. Plenty of Kubernetes, Kubeflow and a healthy amount of distributed training.
      
      - layout: left
        title: Infosys
        link: infosys.com
        link_text: Infosys.com
        sub_title: Senior Systems Engineer
        caption: Jan 2015 - June 2017 · Pune, India
        # quote: >
        #   Solving 21st century problems by
        description: | # this will include new lines to allow paragraphs
            This is where I learned to fix enterprise software in production and work alongside talented developers to keep things running. Most of my work was in Java and Oracle DB - but it's also where I met Python, and promptly fell down the rabbit hole of automating everything and dabbling in data analytics.

  - title: Education # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: San Jose State University (SJSU)
        caption: 2017 - 2019
        sub_title: MSc Computer Science
        # quote: >
        #   Established in 1636, Harvard is the oldest higher education institution in the United States, and is widely regarded in terms of its influence, reputation, and academic pedigree as a leading university in not just the US but also the world.
        description: | # this will include new lines to allow paragraphs
            Headed back to school after a brief stint in industry, focusing on Data Science - and got to apply the tricks for real as a Research Assistant.

            In my free time, I helped start and run an ML club for fellow students at SJSU.

      - layout: left
        title: Mumbai University
        caption: 2010 - 2014
        sub_title: BE (Computer Engg)
        # quote: >
        #   Established in 1636, Harvard is the oldest higher education institution in the United States, and is widely regarded in terms of its influence, reputation, and academic pedigree as a leading university in not just the US but also the world.
        description: | # this will include new lines to allow paragraphs
            Where I was introduced to software development, databases, networking and a fair share of essential life skills. I learned to juggle multiple projects at once and to befriend tough deadlines by burning the occasional midnight oil.

            Outside of class, I joined robotics workshops and hackathons, and served as IT Head and later Secretary of the local chapter of the Computer Society of India (CSI).



  - title: Publications
    layout: text
    content: | # this will include new lines to allow paragraphs
        - GNN-based Root Cause Analysis using multivariate time-series KPIs     [IEEE/IFIP NOMS]

          A graph neural network that pinpoints the root cause of failures from multivariate time-series KPIs.

        - Residual CNN Image Compression            [Published in LNCS Vol. 11845, pp 371 - 382 ](https://link.springer.com/chapter/10.1007/978-3-030-33723-0_30)

          Designed and implemented image compression framework based on fully convolutional neural networks and GANs. Achieved SSIM of 0.86 after 4x compression in size.
        
        - The Nubo Virtual Services Marketplace     [arXiv: 1909.04934](https://arxiv.org/abs/1909.04934)

          Contributed to profile analysis and scalability study for Nubo distributed marketplace with Ethereum based Quorum blockchain.


